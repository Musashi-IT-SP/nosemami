<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nose x Note</title>
<meta name="description" content="Nose x Note — noteの記事を独自ドメインで読む">
<meta property="og:title" content="Nose x Note">
<meta property="og:url" content="https://nosemami.com">
<meta property="og:type" content="website">
<link rel="canonical" href="https://nosemami.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #1565C0;
  --blue-light: #90CAF9;
  --blue-pale: #E3F2FD;
  --blue-bg: #F8FBFF;
  --text: #0d0d0d;
  --text-sub: #444;
  --text-muted: #888;
  --text-faint: #bbb;
  --border: #e8e8e8;
  --font: 'Zen Kaku Gothic New', sans-serif;
  --font-serif: 'DM Serif Display', serif;
}

body {
  font-family: var(--font);
  background: #fff;
  color: var(--text);
  min-height: 100vh;
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
}

a { text-decoration: none; color: inherit; }

/* ── Header ── */
.hdr {
  padding: 0 48px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 0.5px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.hdr-inner {
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hdr-logo {
  font-family: var(--font-serif);
  font-size: 20px;
  color: var(--text);
  letter-spacing: 0.02em;
}

.hdr-nav {
  display: flex;
  gap: 32px;
  align-items: center;
}

.hdr-nav a {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  transition: color 0.15s;
}

.hdr-nav a:hover { color: var(--blue); }

/* ── Hero ── */
.hero {
  display: grid;
  grid-template-columns: 1fr 220px;
  border-bottom: 0.5px solid var(--border);
}

.hero-left {
  padding: 52px 48px 48px;
  border-right: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 300px;
  max-width: 800px;
}

.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.hero-line {
  width: 32px;
  height: 2px;
  background: var(--blue);
  border-radius: 1px;
  flex-shrink: 0;
}

.hero-cat {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--blue);
  text-transform: uppercase;
}

.hero-title {
  font-size: 48px;
  font-weight: 900;
  line-height: 1.35;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-bottom: 28px;
}

.hero-title .accent {
  color: var(--blue);
}

.hero-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text-muted);
  flex-wrap: wrap;
}

.tag {
  display: inline-block;
  font-size: 13px;
  padding: 2px 9px;
  border: 1px solid var(--blue-light);
  border-radius: 2px;
  color: var(--blue);
  font-weight: 700;
  letter-spacing: 0.04em;
}

.hero-read {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--blue);
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1.5px solid var(--blue);
  padding-bottom: 2px;
  transition: opacity 0.15s;
}

.hero-read:hover { opacity: 0.7; }

.hero-right {
  background: var(--blue);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

/* ── Divider ── */
.divider {
  height: 4px;
  background: var(--blue-pale);
  position: relative;
}

.divider::before {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: 120px; height: 4px;
  background: var(--blue);
}

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .hero-right { display: none; }
  .hdr { padding: 0 20px; }
  .hero-left { padding: 32px 20px; }
  .hero-title { font-size: 28px; }
}

.card {
  display: block;
  border-right: 0.5px solid var(--border);
  border-top: 0.5px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
  overflow: hidden;
}

.card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 100%; height: 3px;
  background: var(--blue);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.22s ease;
}

.card:hover::after { transform: scaleX(1); }
.card:hover { background: var(--blue-bg); }
.card:nth-child(3n) { border-right: none; }

.card-body {
  padding: 24px 28px;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
  color: #111;
  margin-bottom: 10px;
}

.card-excerpt {
  font-size: 13px;
  color: #555;
  line-height: 1.8;
  font-weight: 300;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-date {
  font-size: 13px;
  color: var(--text-faint);
  letter-spacing: 0.06em;
}

/* ── Empty state ── */
.empty {
  grid-column: 1 / -1;
  padding: 60px 48px;
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
}

/* ── Footer ── */
.footer {
  padding: 20px 48px;
  border-top: 0.5px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--blue-bg);
  flex-wrap: wrap;
  gap: 10px;
}

.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.footer-l {
  font-size: 13px;
  color: #666;
  letter-spacing: 0.04em;
}

.footer-r {
  font-size: 13px;
  color: var(--blue);
  font-weight: 700;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: opacity 0.15s;
}

.footer-r:hover { opacity: 0.7; }

.updated {
  font-size: 13px;
  color: var(--text-faint);
  text-align: center;
  padding: 10px;
  background: var(--blue-bg);
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <a class="hdr-logo" href="/">Nose x Note</a>
    <nav class="hdr-nav">
      <a href="/">記事一覧</a>
      <a href="https://note.com/nocey" target="_blank" rel="noopener">noteを見る</a>
    </nav>
  </div>
</header>

<div class="wrap">
<main>
  
  <div style="padding:80px 48px;text-align:center;color:#888;">
    <p style="font-size:16px;margin-bottom:8px">記事を読み込んでいます...</p>
    <p style="font-size:13px"><a href="https://note.com/nocey" style="color:#1565C0">noteを直接見る →</a></p>
  </div>
  
</main>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-l">© 2026 Nose x Note</div>
    <a class="footer-r" href="https://note.com/nocey" target="_blank" rel="noopener">
      ↗ noteでもフォロー
    </a>
  </div>
</footer>
<p class="updated">最終更新: 2026/6/6 23:54:23</p>

</body>
</html>
